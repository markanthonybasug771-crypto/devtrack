<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Shared Devotion | Devotional Tracker</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Shared Devotion CSS -->
    <link
        rel="stylesheet"
        href="./css/shared-devotion.css"
    >

<link rel="stylesheet" href="./css/theme.css" />
</head>


<body>


    <!-- ========================================
         MAIN CONTAINER
    ======================================== -->

    <main class="shared-page">


        <!-- ========================================
             HEADER
        ======================================== -->

        <div class="shared-header">

            <div class="brand-badge">
                DT
            </div>

            <div>

                <div class="brand-title">
                    Devotional Tracker
                </div>

                <div class="brand-subtitle">
                    CLG Laoag Music Team
                </div>

            </div>

        </div>


        <!-- ========================================
             LOADING
        ======================================== -->

        <div
            id="loadingState"
            class="loading-state"
        >

            <div
                class="spinner-border"
                role="status"
            ></div>

            <p>
                Loading devotion...
            </p>

        </div>


        <!-- ========================================
             ERROR
        ======================================== -->

        <div
            id="errorState"
            class="error-state d-none"
        >

            <i class="bi bi-exclamation-circle"></i>

            <h3>
                Devotion Not Found
            </h3>

            <p>
                This devotion may no longer be available
                or the sharing link is invalid.
            </p>

        </div>


        <!-- ========================================
             DEVOTION CONTENT
        ======================================== -->

        <article
            id="devotionContent"
            class="devotion-card d-none"
        >


            <!-- TITLE -->

            <div class="devotion-header">

                <div>

                    <span
                        id="devotionFormat"
                        class="format-badge"
                    >
                        SOAP
                    </span>

                    <h1 id="devotionTitle">
                        Untitled Devotion
                    </h1>

                    <p
                        id="devotionDate"
                        class="devotion-date"
                    >
                    </p>

                </div>

            </div>


            <!-- SCRIPTURE -->

            <section class="devotion-section">

                <div class="section-title">

                    <i class="bi bi-book"></i>

                    Scripture

                </div>

                <div
                    id="devotionScripture"
                    class="scripture-box"
                >
                </div>

            </section>


            <!-- OBSERVATION -->

            <section
                id="observationSection"
                class="devotion-section"
            >

                <div class="section-title">

                    <i class="bi bi-eye"></i>

                    Observation

                </div>

                <div
                    id="devotionObservation"
                    class="section-content"
                >
                </div>

            </section>


            <!-- LESSON -->

            <section
                id="lessonSection"
                class="devotion-section d-none"
            >

                <div class="section-title">

                    <i class="bi bi-lightbulb"></i>

                    Lesson

                </div>

                <div
                    id="devotionLesson"
                    class="section-content"
                >
                </div>

            </section>


            <!-- APPLICATION -->

            <section class="devotion-section">

                <div class="section-title">

                    <i class="bi bi-arrow-right-circle"></i>

                    Application

                </div>

                <div
                    id="devotionApplication"
                    class="section-content"
                >
                </div>

            </section>




            <!-- FOOTER -->

            <div class="shared-footer">

                <i class="bi bi-heart-fill"></i>

                Shared from Devotional Tracker

            </div>


        </article>


    </main>


    <!-- Firebase / Shared Devotion JS -->

    <script
        type="module"
        src="./js/shared-devotion.js"
    ></script>
<script type="module" src="./js/transition.js"></script>

</body>

</html>
